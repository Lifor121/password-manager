server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Healthcheck контейнера
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # API -> backend (имя сервиса из docker-compose)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health backend'а (полезно для отладки: http://host/health)
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Неизвестные пути -> SPA (SvelteKit fallback index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэш для иммутабельных ассетов Vite
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
